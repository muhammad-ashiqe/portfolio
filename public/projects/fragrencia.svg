<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Perfume bottle outline -->
  <rect x="160" y="80" width="80" height="120" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.5"/>
  <rect x="175" y="60" width="50" height="25" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.5"/>
  <!-- Spray effect -->
  <circle cx="200" cy="50" r="3" fill="#EC4899" opacity="0.3"/>
  <circle cx="210" cy="45" r="2" fill="#EC4899" opacity="0.25"/>
  <circle cx="190" cy="45" r="2" fill="#EC4899" opacity="0.25"/>
  <circle cx="200" cy="35" r="2.5" fill="#EC4899" opacity="0.2"/>
  <!-- Price tag -->
  <rect x="100" y="180" width="60" height="30" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
  <text x="130" y="200" font-family="monospace" font-size="12" fill="#F59E0B" text-anchor="middle" opacity="0.7">$$$</text>
  <!-- Tech text -->
  <text x="200" y="260" font-family="monospace" font-size="14" fill="#EC4899" text-anchor="middle" opacity="0.7">E-COMMERCE</text>
</svg>
