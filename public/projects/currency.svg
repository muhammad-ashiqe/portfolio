<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Currency symbols in circle -->
  <circle cx="200" cy="130" r="60" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5"/>
  <text x="170" y="140" font-family="monospace" font-size="32" fill="#10B981" opacity="0.6">$</text>
  <text x="210" y="140" font-family="monospace" font-size="32" fill="#10B981" opacity="0.6">€</text>
  <!-- Exchange arrows -->
  <path d="M 90 150 L 130 150" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
  <polygon points="125,145 135,150 125,155" fill="#3B82F6" opacity="0.5"/>
  <path d="M 270 150 L 310 150" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
  <polygon points="275,145 265,150 275,155" fill="#3B82F6" opacity="0.5"/>
  <!-- Rate display -->
  <text x="200" y="210" font-family="monospace" font-size="16" fill="#F59E0B" text-anchor="middle" opacity="0.6">1.00 = 0.92</text>
  <text x="200" y="270" font-family="monospace" font-size="14" fill="#10B981" text-anchor="middle" opacity="0.7">CURRENCY_EXCHANGE</text>
</svg>
