<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Chat bubbles -->
  <rect x="80" y="80" width="120" height="60" rx="8" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.5"/>
  <circle cx="110" cy="110" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="130" cy="110" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="150" cy="110" r="3" fill="#06B6D4" opacity="0.6"/>
  
  <rect x="200" y="160" width="120" height="60" rx="8" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>
  <circle cx="230" cy="190" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="250" cy="190" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="270" cy="190" r="3" fill="#8B5CF6" opacity="0.6"/>
  
  <!-- Connection lines -->
  <path d="M 160 140 L 220 160" stroke="#06B6D4" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  
  <!-- Tech text -->
  <text x="200" y="270" font-family="monospace" font-size="14" fill="#06B6D4" text-anchor="middle" opacity="0.7">REALTIME_CHAT</text>
</svg>
