<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Media player screen -->
  <rect x="100" y="80" width="200" height="140" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>
  <!-- Play button -->
  <polygon points="170,130 170,170 210,150" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
  <circle cx="190" cy="150" r="40" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
  <!-- Volume bars -->
  <rect x="130" y="200" width="8" height="20" fill="#8B5CF6" opacity="0.3"/>
  <rect x="145" y="190" width="8" height="30" fill="#8B5CF6" opacity="0.4"/>
  <rect x="160" y="180" width="8" height="40" fill="#8B5CF6" opacity="0.5"/>
  <rect x="175" y="190" width="8" height="30" fill="#8B5CF6" opacity="0.4"/>
  <rect x="190" y="200" width="8" height="20" fill="#8B5CF6" opacity="0.3"/>
  <text x="200" y="270" font-family="monospace" font-size="14" fill="#8B5CF6" text-anchor="middle" opacity="0.7">VIDEO_LIBRARY</text>
</svg>
