<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Food delivery box -->
  <rect x="140" y="100" width="120" height="100" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5"/>
  <line x1="140" y1="100" x2="260" y2="200" stroke="#10B981" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="100" x2="140" y2="200" stroke="#10B981" stroke-width="1" opacity="0.3"/>
  <!-- Delivery route -->
  <circle cx="80" cy="80" r="8" fill="#F59E0B" opacity="0.5"/>
  <circle cx="200" cy="150" r="12" fill="#10B981" opacity="0.6"/>
  <circle cx="320" cy="220" r="8" fill="#F59E0B" opacity="0.5"/>
  <path d="M 80 80 Q 140 100 200 150 T 320 220" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.4"/>
  <!-- Tech text -->
  <text x="200" y="260" font-family="monospace" font-size="14" fill="#10B981" text-anchor="middle" opacity="0.7">FOOD_DELIVERY</text>
</svg>
